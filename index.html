<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Vanguard Dex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bug: '#A8B820',
            dark: '#705848',
            dragon: '#7038F8',
            electric: '#F8D030',
            fairy: '#EE99AC',
            fighting: '#C03028',
            fire: '#F08030',
            flying: '#A890F0',
            ghost: '#705898',
            grass: '#78C850',
            ground: '#E0C068',
            ice: '#98D8D8',
            normal: '#A8A878',
            poison: '#A040A0',
            psychic: '#F85888',
            rock: '#B8A038',
            steel: '#B8B8D0',
            water: '#6890F0',
            sound: '#06b6d4',
            typeless: '#68A090'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    
    .type-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px 4px 6px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .type-pill img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 10;
      background: inherit;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col selection:bg-rose-500 selection:text-white transition-colors duration-200">

  <!-- Streamlined Header -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 shadow-xs">
    <div class="max-w-4xl mx-auto px-3 h-14 flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 min-w-0">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center text-white shadow-xs text-xs flex-shrink-0">
          <i class="fa-solid fa-cube"></i>
        </div>
        <h1 class="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-slate-100 tracking-tight truncate">Vanguard Dex</h1>
      </div>

      <div class="flex items-center gap-1.5 flex-shrink-0">
        <div class="bg-slate-100 dark:bg-slate-950 p-0.5 rounded-xl flex text-xs font-bold border border-transparent dark:border-slate-800">
          <button id="nav-btn-pkmn" onclick="switchTab('pokemon')" title="Pokémon" class="px-2 py-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-slate-100 transition text-xs flex items-center gap-1">
            <i class="fa-solid fa-paw"></i> <span class="hidden sm:inline">(<span id="count-pkmn">0</span>)</span>
          </button>
          <button id="nav-btn-moves" onclick="switchTab('moves')" title="Moves" class="px-2 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition text-xs flex items-center gap-1">
            <i class="fa-solid fa-bolt"></i> <span class="hidden sm:inline">(<span id="count-mvs">0</span>)</span>
          </button>
          <button id="nav-btn-team" onclick="switchTab('team')" title="Team Builder" class="px-2 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition text-xs flex items-center gap-1">
            <i class="fa-solid fa-users"></i> <span class="hidden sm:inline">(<span id="count-team">0</span>/6)</span>
          </button>
          <button id="nav-btn-chart" onclick="switchTab('chart')" title="Type Chart" class="px-2 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition text-xs flex items-center gap-1">
            <i class="fa-solid fa-table-cells"></i>
          </button>
        </div>

        <button onclick="toggleTheme()" title="Toggle Theme" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
          <i class="fa-solid fa-moon inline dark:hidden text-indigo-600"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main id="main-viewport" class="max-w-4xl mx-auto px-4 py-5 flex-1 w-full">

    <!-- Loading Banner -->
    <div id="upload-banner" class="mb-6 p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-center shadow-xs">
      <div class="max-w-md mx-auto space-y-3">
        <div id="loading-spinner" class="w-12 h-12 mx-auto rounded-2xl bg-rose-50 dark:bg-rose-500/10 text-rose-500 dark:text-rose-400 flex items-center justify-center text-lg border border-transparent dark:border-rose-500/20">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
        <h2 id="banner-title" class="font-extrabold text-base text-slate-900 dark:text-slate-100">Loading Assets from GitHub...</h2>
        <p id="banner-desc" class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
          Fetching text files and extracting sprite archives from your repository.
        </p>
      </div>
    </div>

    <!-- Search & Filter Toolbar -->
    <section id="filter-toolbar" class="mb-4 hidden">
      <div class="relative flex items-center">
        <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-xs"></i>
        <input type="text" id="search-box" oninput="applyFilter()" placeholder="Search by name, ID, move, ability..." 
               class="w-full pl-9 pr-10 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-medium text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-500 shadow-2xs">
        <button onclick="openFilterModal()" title="Filter & Sort" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>
    </section>

    <!-- Content Feed Container -->
    <section id="content-feed" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
      <!-- Cards rendered here -->
    </section>

  </main>

  <!-- Filter & Sort Popup Modal -->
  <div id="filter-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl p-5 relative animate-in fade-in zoom-in duration-150">
      <button onclick="closeFilterModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400 transition">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>

      <h3 class="font-extrabold text-base text-slate-900 dark:text-slate-100 mb-4">Filter & Sort Options</h3>

      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Sort Order</label>
          <select id="sort-box" onchange="applyFilter()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2.5 font-bold text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer">
            <option value="id-asc">ID (# Ascending)</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="bst-desc">Stat Total (High to Low)</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Filter by Type</label>
          <div id="type-pills" class="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <div class="mt-6 flex justify-end">
        <button onclick="closeFilterModal()" class="px-4 py-2 text-xs font-bold bg-rose-500 hover:bg-rose-600 text-white rounded-xl shadow">Apply Filters</button>
      </div>
    </div>
  </div>

  <!-- Move Detail Popup Modal -->
  <div id="move-modal" class="fixed inset-0 z-60 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl p-5 relative animate-in fade-in zoom-in duration-150">
      <button onclick="closeMoveModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400 transition z-20">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
      <div id="move-popup-content" class="space-y-3"></div>
    </div>
  </div>

  <!-- Add to Team Selection Modal -->
  <div id="team-pick-modal" class="fixed inset-0 z-60 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-5 relative max-h-[80vh] flex flex-col">
      <button onclick="closeTeamPickModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400 transition z-20">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
      <h3 class="font-extrabold text-base text-slate-900 dark:text-slate-100 mb-3">Select Pokémon for Slot <span id="slot-index-label">1</span></h3>
      <input type="text" id="team-search-input" oninput="renderTeamPickerList()" placeholder="Search Pokémon..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-medium text-slate-800 dark:text-slate-200 focus:outline-none mb-3">
      <div id="team-picker-list" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[50vh]"></div>
    </div>
  </div>

  <!-- Team Member Configuration Modal -->
  <div id="team-config-modal" class="fixed inset-0 z-60 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-5 relative max-h-[85vh] flex flex-col">
      <button onclick="closeTeamConfigModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400 transition z-20">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
      <h3 id="config-modal-title" class="font-extrabold text-base text-slate-900 dark:text-slate-100 mb-3">Configure Moveset</h3>
      <div id="team-config-content" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
      <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex justify-end">
        <button onclick="closeTeamConfigModal()" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow">Done</button>
      </div>
    </div>
  </div>

  <!-- Move Picker for Team Member -->
  <div id="move-picker-modal" class="fixed inset-0 z-70 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-5 relative max-h-[80vh] flex flex-col">
      <button onclick="closeMovePickerModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400 transition z-20">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
      <h3 class="font-extrabold text-base text-slate-900 dark:text-slate-100 mb-3">Select Move</h3>
      <input type="text" id="move-picker-search" oninput="renderMovePickerList()" placeholder="Search learnset moves..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-medium text-slate-800 dark:text-slate-200 focus:outline-none mb-3">
      <div id="move-picker-list" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[50vh]"></div>
    </div>
  </div>

  <script>
    const GITHUB_REPO_URL = "https://raw.githubusercontent.com/bossofthem25/nifhtwave-assets/main/";

    let pokemonList = [];
    let pokemonMap = {};
    let movesMap = {};
    let abilitiesMap = {};
    let spriteMap = {};
    let typeIconMap = {};
    let activeTab = 'pokemon';
    let selectedType = null;
    let currentViewMode = 'grid';
    let activePokemon = null;
    let activeMoveSubTab = 'all';
    let moveFilterType = 'ALL';
    let moveFilterCategory = 'ALL';

    let currentTeam = [null, null, null, null, null, null];
    let selectingSlotIndex = 0;
    let configuringSlotIndex = 0;
    let configuringMoveSlotIndex = 0;

    const CHART_TYPES = ['NORMAL','FIGHTING','FLYING','POISON','GROUND','ROCK','BUG','GHOST','STEEL','FIRE','WATER','GRASS','ELECTRIC','PSYCHIC','ICE','DRAGON','DARK','FAIRY','SOUND'];
    const STAT_NAMES = ['HP', 'Atk', 'Def', 'Spd', 'SpAtk', 'SpDef'];
    const TYPE_COLORS = {
      BUG: 'bg-bug text-slate-950',
      DARK: 'bg-dark text-white',
      DRAGON: 'bg-dragon text-white',
      ELECTRIC: 'bg-electric text-slate-950',
      FAIRY: 'bg-fairy text-slate-950',
      FIGHTING: 'bg-fighting text-white',
      FIRE: 'bg-fire text-white',
      FLYING: 'bg-flying text-white',
      GHOST: 'bg-ghost text-white',
      GRASS: 'bg-grass text-slate-950',
      GROUND: 'bg-ground text-slate-950',
      ICE: 'bg-ice text-slate-950',
      NORMAL: 'bg-normal text-slate-950',
      POISON: 'bg-poison text-white',
      PSYCHIC: 'bg-psychic text-white',
      ROCK: 'bg-rock text-white',
      STEEL: 'bg-steel text-slate-950',
      WATER: 'bg-water text-white',
      SOUND: 'bg-sound text-white',
      TYPELESS: 'bg-typeless text-white'
    };

    const TYPE_CHART = {
      NORMAL: { weaknesses: ['FIGHTING'], resistances: [], immunities: ['GHOST'] },
      FIGHTING: { weaknesses: ['FLYING', 'PSYCHIC', 'FAIRY'], resistances: ['ROCK', 'BUG', 'DARK'], immunities: [] },
      FLYING: { weaknesses: ['ROCK', 'ELECTRIC', 'ICE'], resistances: ['FIGHTING', 'BUG', 'GRASS'], immunities: ['GROUND'] },
      POISON: { weaknesses: ['GROUND', 'PSYCHIC'], resistances: ['FIGHTING', 'POISON', 'BUG', 'GRASS', 'FAIRY'], immunities: [] },
      GROUND: { weaknesses: ['WATER', 'GRASS', 'ICE'], resistances: ['POISON', 'ROCK'], immunities: ['ELECTRIC'] },
      ROCK: { weaknesses: ['FIGHTING', 'GROUND', 'STEEL', 'WATER', 'GRASS'], resistances: ['NORMAL', 'FLYING', 'POISON', 'FIRE', 'SOUND'], immunities: [] },
      BUG: { weaknesses: ['FLYING', 'ROCK', 'FIRE'], resistances: ['FIGHTING', 'GROUND', 'GRASS', 'SOUND'], immunities: [] },
      GHOST: { weaknesses: ['GHOST', 'DARK'], resistances: ['POISON', 'BUG'], immunities: ['NORMAL', 'FIGHTING'] },
      STEEL: { weaknesses: ['FIGHTING', 'GROUND', 'FIRE', 'SOUND'], resistances: ['NORMAL', 'FLYING', 'ROCK', 'BUG', 'STEEL', 'GRASS', 'PSYCHIC', 'ICE', 'DRAGON', 'FAIRY'], immunities: ['POISON'] },
      FIRE: { weaknesses: ['GROUND', 'ROCK', 'WATER', 'SOUND'], resistances: ['BUG', 'STEEL', 'FIRE', 'GRASS', 'ICE', 'FAIRY'], immunities: [] },
      WATER: { weaknesses: ['GRASS', 'ELECTRIC', 'SOUND'], resistances: ['STEEL', 'FIRE', 'WATER', 'ICE'], immunities: [] },
      GRASS: { weaknesses: ['FLYING', 'POISON', 'BUG', 'FIRE', 'ICE'], resistances: ['GROUND', 'WATER', 'GRASS', 'ELECTRIC', 'SOUND'], immunities: [] },
      ELECTRIC: { weaknesses: ['GROUND'], resistances: ['FLYING', 'STEEL', 'ELECTRIC', 'SOUND'], immunities: [] },
      PSYCHIC: { weaknesses: ['BUG', 'GHOST', 'DARK'], resistances: ['FIGHTING', 'PSYCHIC'], immunities: ['SOUND'] },
      ICE: { weaknesses: ['FIGHTING', 'ROCK', 'STEEL', 'FIRE'], resistances: ['ICE', 'SOUND'], immunities: [] },
      DRAGON: { weaknesses: ['ICE', 'DRAGON', 'FAIRY'], resistances: ['FIRE', 'WATER', 'GRASS', 'ELECTRIC'], immunities: [] },
      DARK: { weaknesses: ['FIGHTING', 'BUG', 'FAIRY'], resistances: ['GHOST', 'DARK'], immunities: ['PSYCHIC'] },
      FAIRY: { weaknesses: ['POISON', 'STEEL', 'SOUND'], resistances: ['BUG', 'DARK', 'FIGHTING'], immunities: ['DRAGON'] },
      SOUND: { weaknesses: ['ELECTRIC', 'ICE', 'PSYCHIC'], resistances: ['FIRE', 'WATER', 'FAIRY', 'SOUND'], immunities: [] },
      TYPELESS: { weaknesses: ['FIGHTING'], resistances: [], immunities: ['GHOST'] }
    };

    window.onload = function() {
      buildTypePills();
      fetchGitHubAssets();
    };

    async function fetchGitHubAssets() {
      try {
        const [pokeRes, moveRes, abilRes, frontZipRes, typeZipRes] = await Promise.all([
          fetch(GITHUB_REPO_URL + 'pokemon.txt').catch(() => null),
          fetch(GITHUB_REPO_URL + 'moves.txt').catch(() => null),
          fetch(GITHUB_REPO_URL + 'abilities.txt').catch(() => null),
          fetch(GITHUB_REPO_URL + 'pokemon_sprits.zip').catch(() => null),
          fetch(GITHUB_REPO_URL + 'type_sprits.zip').catch(() => null)
        ]);

        if (abilRes && abilRes.ok) parseAbilities(await abilRes.text());
        if (moveRes && moveRes.ok) parseMoves(await moveRes.text());
        if (pokeRes && pokeRes.ok) parsePokemon(await pokeRes.text());

        if (frontZipRes && frontZipRes.ok) {
          const blob = await frontZipRes.blob();
          const zip = new JSZip();
          const content = await zip.loadAsync(blob);
          for (let fn of Object.keys(content.files)) {
            const entry = content.files[fn];
            if (entry.dir) continue;
            const imgBlob = await entry.async("blob");
            const base64 = await blobToBase64(imgBlob);
            const base = fn.split('/').pop().split('.')[0].toUpperCase();
            spriteMap[base] = base64;
            const num = parseInt(base, 10);
            if (!isNaN(num)) spriteMap[num] = base64;
          }
        }

        if (typeZipRes && typeZipRes.ok) {
          const blob = await typeZipRes.blob();
          const zip = new JSZip();
          const content = await zip.loadAsync(blob);
          for (let fn of Object.keys(content.files)) {
            const entry = content.files[fn];
            if (entry.dir) continue;
            const imgBlob = await entry.async("blob");
            const base64 = await blobToBase64(imgBlob);
            const base = fn.split('/').pop().split('.')[0].toUpperCase();
            typeIconMap[base] = base64;
          }
        }

        if (pokemonList.length > 0) {
          document.getElementById('upload-banner').classList.add('hidden');
          document.getElementById('filter-toolbar').classList.remove('hidden');
          buildTypePills();
          applyFilter();
        } else {
          document.getElementById('loading-spinner').innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
          document.getElementById('banner-title').innerText = "Could not parse Pokémon data";
          document.getElementById('banner-desc').innerText = "Check your pokemon.txt formatting or file locations in GitHub.";
        }
      } catch (e) {
        console.error("GitHub fetch error:", e);
        document.getElementById('loading-spinner').innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
        document.getElementById('banner-title').innerText = "GitHub Fetch Failed";
      }
    }

    function blobToBase64(blob) {
      return new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onloadend = () => res(reader.result);
        reader.onerror = rej;
        reader.readAsDataURL(blob);
      });
    }

    function getSpriteUrl(p) {
      return spriteMap[p.id] || spriteMap[p.internalName] || spriteMap[String(p.id).padStart(3, '0')] || '';
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function switchTab(tab) {
      currentViewMode = 'grid';
      activeTab = tab;
      const bPkmn = document.getElementById('nav-btn-pkmn');
      const bMoves = document.getElementById('nav-btn-moves');
      const bTeam = document.getElementById('nav-btn-team');
      const bChart = document.getElementById('nav-btn-chart');

      bPkmn.className = "px-2 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 transition text-xs flex items-center gap-1";
      bMoves.className = "px-2 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 transition text-xs flex items-center gap-1";
      bTeam.className = "px-2 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 transition text-xs flex items-center gap-1";
      bChart.className = "px-2 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 transition text-xs flex items-center gap-1";

      if (tab === 'pokemon') {
        bPkmn.className = "px-2 py-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-slate-100 transition text-xs flex items-center gap-1";
        document.getElementById('filter-toolbar').classList.remove('hidden');
        applyFilter();
      } else if (tab === 'moves') {
        bMoves.className = "px-2 py-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-slate-100 transition text-xs flex items-center gap-1";
        document.getElementById('filter-toolbar').classList.remove('hidden');
        applyFilter();
      } else if (tab === 'team') {
        bTeam.className = "px-2 py-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-slate-100 transition text-xs flex items-center gap-1";

    function closeFilterModal() { document.getElementById('filter-modal').classList.add('hidden'); }
    function closeMoveModal() { document.getElementById('move-modal').classList.add('hidden'); }

    function renderTypeBadge(typeName) {
      const color = TYPE_COLORS[typeName] || 'bg-slate-700 text-white';
      const iconUrl = typeIconMap[typeName] || '';
      return `
        <span class="type-pill ${color}">
          ${iconUrl ? `<img src="${iconUrl}" alt="${typeName}">` : `<i class="fa-solid fa-tag text-[9px]"></i>`}
          <span>${typeName}</span>
        </span>
      `;
    }

    function parseAbilities(text) {
      abilitiesMap = {};
      text.split(/^#-+$/m).forEach(sec => {
        const m = sec.match(/\[([A-Z0-9_]+)\]/);
        if (!m) return;
        const key = m[1].toUpperCase();
        let abName = key;
        let abDesc = "No description available.";
        
        sec.split(/\r?\n/).forEach(line => {
          line = line.trim();
          if (!line.includes('=')) return;
          const idx = line.indexOf('=');
          const k = line.substring(0, idx).trim().toUpperCase();
          const v = line.substring(idx + 1).trim();
          if (k === 'NAME') abName = v;
          else if (k === 'DESCRIPTION') abDesc = v;
        });

        abilitiesMap[key] = { name: abName, description: abDesc };
        abilitiesMap[abName.toUpperCase()] = { name: abName, description: abDesc };
      });
    }

    function parseMoves(text) {
      movesMap = {};
      text.split(/^#-+$/m).forEach(sec => {
        const m = sec.match(/\[([A-Z0-9_]+)\]/);
        if (!m) return;
        const key = m[1].toUpperCase();
        let move = { internalName: key, name: key, type: 'NORMAL', category: 'Physical', power: 0, accuracy: 0, pp: 10, description: 'No description.' };
        
        sec.split(/\r?\n/).forEach(line => {
          line = line.trim();
          if (!line.includes('=')) return;
          const idx = line.indexOf('=');
          const k = line.substring(0, idx).trim().toUpperCase();
          const v = line.substring(idx + 1).trim();
          if (k === 'NAME') move.name = v;
          else if (k === 'TYPE') move.type = v.toUpperCase();
          else if (k === 'CATEGORY') move.category = v;
          else if (k === 'POWER') move.power = parseInt(v, 10) || 0;
          else if (k === 'ACCURACY') move.accuracy = parseInt(v, 10) || 0;
          else if (k === 'TOTALPP') move.pp = parseInt(v, 10) || 10;
          else if (k === 'DESCRIPTION') move.description = v;
        });

        movesMap[key] = move;
        movesMap[move.name.toUpperCase()] = move;
      });
      document.getElementById('count-mvs').innerText = Object.keys(movesMap).length / 2;
    }

    function parsePokemon(text) {
      pokemonList = [];
      pokemonMap = {};
      text.split(/^#-+$/m).forEach(sec => {
        const m = sec.match(/\[([0-9A-Za-z_]+)\]/);
        if (!m) return;
        const rawId = m[1];
        let p = {
          id: parseInt(rawId, 10) || rawId,
          internalName: '',
          name: '',
          type1: 'NORMAL',
          type2: null,
          baseStats: [50, 50, 50, 50, 50, 50],
          bst: 300,
          abilities: [],
          hiddenAbility: null,
          movesLevel: [],
          tutorMoves: [],
          eggMoves: [],
          height: 1.0,
          weight: 10.0,
          kind: '',
          pokedex: '',
          growthRate: 'Medium',
          genderRate: '50%',
          eggGroups: 'Monster',
          formName: ''
        };

        sec.split(/\r?\n/).forEach(line => {
          line = line.trim();
          if (!line.includes('=')) return;
          const idx = line.indexOf('=');
          const k = line.substring(0, idx).trim().toUpperCase();
          const v = line.substring(idx + 1).trim();

          if (k === 'NAME') p.name = v;
          else if (k === 'INTERNALNAME') p.internalName = v.toUpperCase();
          else if (k === 'TYPE1' || k === 'TYPES') {
            const types = v.split(',').map(s => s.trim().toUpperCase());
            p.type1 = types[0];
            if (types[1]) p.type2 = types[1];
          }
          else if (k === 'TYPE2') p.type2 = v.toUpperCase();
          else if (k === 'BASESTATS') {
            const stats = v.split(',').map(s => parseInt(s.trim(), 10) || 0);
            if (stats.length >= 6) {
              p.baseStats = stats.slice(0, 6);
              p.bst = p.baseStats.reduce((a, b) => a + b, 0);
            }
          }
          else if (k === 'ABILITIES') p.abilities = v.split(',').map(s => s.trim());
          else if (k === 'HIDDENABILITY' || k === 'HIDDENABILITIES') p.hiddenAbility = v;
          else if (k === 'MOVES') {
            const parts = v.split(',');
            for (let i = 0; i < parts.length; i += 2) {
              if (parts[i+1]) p.movesLevel.push({ level: parseInt(parts[i].trim(), 10) || 1, moveKey: parts[i+1].trim() });
            }
          }
          else if (k === 'TUTORMOVES') p.tutorMoves = v.split(',').map(s => s.trim());
          else if (k === 'EGGMOVES') p.eggMoves = v.split(',').map(s => s.trim());
          else if (k === 'HEIGHT') p.height = parseFloat(v) || 1.0;
          else if (k === 'WEIGHT') p.weight = parseFloat(v) || 10.0;
          else if (k === 'KIND' || k === 'CATEGORY') p.kind = v;
          else if (k === 'POKEDEX') p.pokedex = v;
          else if (k === 'GROWTHRATE') p.growthRate = v;
          else if (k === 'GENDERRATE' || k === 'GENDERRATIO') p.genderRate = v;
          else if (k === 'COMPATIBILITY' || k === 'EGGGROUPS') p.eggGroups = v;
          else if (k === 'FORMNAME') p.formName = v;
        });

        if (!p.internalName) p.internalName = (p.name || rawId).toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!p.name) p.name = p.internalName;

        pokemonList.push(p);
        pokemonMap[p.internalName] = p;
        if (typeof p.id === 'number') pokemonMap[p.id] = p;
      });
      document.getElementById('count-pkmn').innerText = pokemonList.length;
    }

    function buildTypePills() {
      const container = document.getElementById('type-pills');
      let html = `<button onclick="filterByType(null)" class="w-full py-1.5 rounded-xl text-[10px] font-bold ${selectedType === null ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-950 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800'}">ALL</button>`;
      CHART_TYPES.forEach(t => {
        const badgeColor = TYPE_COLORS[t] || 'bg-slate-700 text-white';
        const iconUrl = typeIconMap[t] || '';
        const content = iconUrl ? `<img src="${iconUrl}" class="w-3.5 h-3.5 object-contain inline-block mr-1"> ${t}` : t;
        html += `<button onclick="filterByType('${t}')" class="w-full py-1.5 rounded-xl text-[10px] font-black text-center truncate ${badgeColor} ${selectedType === t ? 'ring-2 ring-indigo-500' : 'opacity-80'}">${content}</button>`;
      });
      container.innerHTML = html;
    }

    function filterByType(t) {
      selectedType = (selectedType === t) ? null : t;
      buildTypePills();
      applyFilter();
    }

    function applyFilter() {
      if (currentViewMode === 'detail' || activeTab === 'chart' || activeTab === 'team') return;
      const q = document.getElementById('search-box').value.toLowerCase().trim();
      const s = document.getElementById('sort-box').value;
      const feed = document.getElementById('content-feed');

      if (activeTab === 'pokemon') {
        let list = pokemonList.filter(p => {
          if (selectedType && p.type1 !== selectedType && p.type2 !== selectedType) return false;
          if (q) {
            return p.name.toLowerCase().includes(q) || String(p.id) === q || p.abilities.some(a => a.toLowerCase().includes(q));
          }
          return true;
        });

        list.sort((a, b) => {
          if (s === 'id-asc') return (typeof a.id === 'number' ? a.id : 9999) - (typeof b.id === 'number' ? b.id : 9999);
          if (s === 'name-asc') return a.name.localeCompare(b.name);
          if (s === 'bst-desc') return b.bst - a.bst;
          return 0;
        });

        if (list.length === 0) {
          feed.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 dark:text-slate-500 font-bold text-xs">No Pokémon found.</div>`;
          return;
        }

        feed.innerHTML = list.map(p => {
          const t1 = renderTypeBadge(p.type1);
          const t2 = p.type2 ? renderTypeBadge(p.type2) : '';
          const sprite = getSpriteUrl(p);

          return `
            <div onclick="navigateToPokemonPage('${p.internalName}')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 shadow-xs hover:shadow-md hover:border-slate-300 dark:hover:border-slate-700 transition cursor-pointer flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between text-[10px] mb-1">
                  <span class="font-mono font-bold text-slate-400 dark:text-slate-500">#${p.id}</span>
                  <span class="text-[8px] font-bold px-1.5 py-0.2 rounded-full bg-slate-100 dark:bg-slate-950 text-slate-600 dark:text-slate-400 border border-transparent dark:border-slate-800">BST ${p.bst}</span>
                </div>
                <div class="w-14 h-14 mx-auto my-1 flex items-center justify-center">
                  ${sprite ? `<img src="${sprite}" class="max-w-full max-h-full object-contain">` : `<i class="fa-solid fa-dragon text-slate-300 dark:text-slate-700 text-lg"></i>`}
                </div>
                <h3 class="font-extrabold text-xs text-center text-slate-900 dark:text-slate-100 truncate">${p.name}</h3>
                ${p.formName ? `<p class="text-[8px] text-center text-rose-500 dark:text-rose-400 font-bold">${p.formName}</p>` : ''}
              </div>
              <div class="flex flex-wrap justify-center gap-1 mt-2">
                ${t1}
                ${t2}
              </div>
            </div>
          `;
        }).join('');
      } else {
        const unique = {};
        Object.values(movesMap).forEach(m => unique[m.internalName] = m);
        let moves = Object.values(unique).filter(m => {
          if (selectedType && m.type !== selectedType) return false;
          if (q) return m.name.toLowerCase().includes(q) || m.description.toLowerCase().includes(q);
          return true;
        });

        if (moves.length === 0) {
          feed.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 dark:text-slate-500 font-bold text-xs">No moves found.</div>`;
          return;
        }

        feed.innerHTML = moves.map(m => {
          const tBadge = renderTypeBadge(m.type);
          const safeDesc = (m.description || '').replace(/'/g, "\\'").replace(/\n/g, ' ');
          return `
            <div onclick="openMoveModal('${m.name}', '${m.type}', '${m.category}', ${m.power}, ${m.accuracy}, ${m.pp}, '${safeDesc}')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 shadow-xs hover:shadow-md hover:border-slate-300 dark:hover:border-slate-700 transition cursor-pointer flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-1 gap-1">
                  <h3 class="font-extrabold text-xs text-slate-900 dark:text-slate-100 truncate">${m.name}</h3>
                  ${tBadge}
                </div>
                <p class="text-[10px] text-slate-500 dark:text-slate-400 line-clamp-2">${m.description}</p>
              </div>
              <div class="flex justify-between items-center text-[9px] font-mono text-slate-400 dark:text-slate-500 pt-2 mt-2 border-t border-slate-100 dark:border-slate-800">
                <span class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-950 text-slate-600 dark:text-slate-300 font-bold">
                  ${m.category}
                </span>
                <span>Pow: ${m.power > 0 ? m.power : '-'}</span>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    // --- TEAM BUILDER LOGIC ---
    function openTeamPicker(slotIndex) {
      selectingSlotIndex = slotIndex;
      document.getElementById('slot-index-label').innerText = slotIndex + 1;
      document.getElementById('team-search-input').value = '';
      renderTeamPickerList();
      document.getElementById('team-pick-modal').classList.remove('hidden');
    }

    function renderTeamPickerList() {
      const q = document.getElementById('team-search-input').value.toLowerCase().trim();
      const listEl = document.getElementById('team-picker-list');

      let filtered = pokemonList.filter(p => {
        if (!q) return true;
        return p.name.toLowerCase().includes(q) || String(p.id) === q;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">No matching Pokémon.</p>`;
        return;
      }

      listEl.innerHTML = filtered.map(p => {
        const sprite = getSpriteUrl(p);
        return `
          <div onclick="assignPokemonToTeam('${p.internalName}')" class="p-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl hover:border-rose-500 cursor-pointer flex items-center justify-between transition">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-900 rounded-lg">
                ${sprite ? `<img src="${sprite}" class="max-w-full max-h-full object-contain">` : `<i class="fa-solid fa-dragon text-slate-400"></i>`}
              </div>
              <div>
                <span class="text-[10px] font-mono text-slate-400">#${p.id}</span>
                <h4 class="font-bold text-xs text-slate-800 dark:text-slate-200">${p.name}</h4>
              </div>
            </div>
            <div class="flex gap-1">${renderTypeBadge(p.type1)} ${p.type2 ? renderTypeBadge(p.type2) : ''}</div>
          </div>
        `;
      }).join('');
    }

    function assignPokemonToTeam(internalName) {
      const p = pokemonMap[internalName];
      if (!p) return;
      currentTeam[selectingSlotIndex] = { p: p, moves: [null, null, null, null] };
      closeTeamPickModal();
      renderTeamBuilderPage();
      updateTeamCountBadge();
    }

    function removeFromTeam(slotIndex, event) {
      event.stopPropagation();
      currentTeam[slotIndex] = null;
      renderTeamBuilderPage();
      updateTeamCountBadge();
    }

    function openTeamConfigModal(slotIndex) {
      configuringSlotIndex = slotIndex;
      const member = currentTeam[slotIndex];
      if (!member) return;

      document.getElementById('config-modal-title').innerText = `Configure Moves: ${member.p.name}`;
      let contentEl = document.getElementById('team-config-content');

      let movesHtml = member.moves.map((mKey, mIdx) => {
        let mData = mKey ? movesMap[mKey.toUpperCase()] : null;
        return `
          <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl">
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-bold text-slate-400">#${mIdx + 1}</span>
              <span class="text-xs font-bold text-slate-700 dark:text-slate-300">${mData ? mData.name : 'Empty Move Slot'}</span>
            </div>
            <button onclick="openMovePicker(${slotIndex}, ${mIdx})" class="px-3 py-1 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-bold">
              ${mData ? 'Change' : 'Add Move'}
            </button>
          </div>
        `;
      }).join('');

      contentEl.innerHTML = `<div class="space-y-2">${movesHtml}</div>`;
      document.getElementById('team-config-modal').classList.remove('hidden');
    }

    function openMovePicker(slotIndex, moveSlotIndex) {
      configuringSlotIndex = slotIndex;
      configuringMoveSlotIndex = moveSlotIndex;
      document.getElementById('move-picker-search').value = '';
      renderMovePickerList();
      document.getElementById('move-picker-modal').classList.remove('hidden');
    }

    function renderMovePickerList() {
      const q = document.getElementById('move-picker-search').value.toLowerCase().trim();
      const listEl = document.getElementById('move-picker-list');
      const member = currentTeam[configuringSlotIndex];
      if (!member) return;

      let availableKeys = new Set();
      member.p.movesLevel.forEach(m => availableKeys.add(m.moveKey.toUpperCase()));
      member.p.tutorMoves.forEach(k => availableKeys.add(k.toUpperCase()));
      member.p.eggMoves.forEach(k => availableKeys.add(k.toUpperCase()));

      let list = [];
      availableKeys.forEach(k => {
        if (movesMap[k]) list.push(movesMap[k]);
      });

      if (list.length === 0) {
        list = Object.values(movesMap).filter((v, i, self) => i === self.findIndex(t => t.internalName === v.internalName));
      }

      let filtered = list.filter(m => {
        if (!q) return true;
        return m.name.toLowerCase().includes(q) || m.type.toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">No moves found.</p>`;
        return;
      }

      listEl.innerHTML = filtered.slice(0, 50).map(m => {
        return `
          <div onclick="assignMoveToMember('${m.internalName}')" class="p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl hover:border-rose-500 cursor-pointer flex items-center justify-between transition">
            <div>
              <h4 class="font-bold text-xs text-slate-800 dark:text-slate-200">${m.name}</h4>
              <p class="text-[10px] text-slate-400">Pow: ${m.power > 0 ? m.power : '-'} | Cat: ${m.category}</p>
            </div>
            ${renderTypeBadge(m.type)}
          </div>
        `;
      }).join('');
    }

    function assignMoveToMember(moveKey) {
      const member = currentTeam[configuringSlotIndex];
      if (!member) return;
      member.moves[configuringMoveSlotIndex] = moveKey;
      closeMovePickerModal();
      openTeamConfigModal(configuringSlotIndex);
    }

    function updateTeamCountBadge() {
      const count = currentTeam.filter(Boolean).length;
      document.getElementById('count-team').innerText = count;
    }

    function renderTeamBuilderPage() {
      const feed = document.getElementById('content-feed');
      updateTeamCountBadge();

      let slotsHtml = currentTeam.map((member, idx) => {
        if (!member) {
          return `
            <div onclick="openTeamPicker(${idx})" class="border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center gap-2 hover:border-rose-500 dark:hover:border-rose-500 cursor-pointer transition min-h-[160px] bg-white/50 dark:bg-slate-900/50">
              <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-sm">
                <i class="fa-solid fa-plus"></i>
              </div>
              <span class="text-xs font-bold text-slate-500 dark:text-slate-400">Slot ${idx + 1} (Empty)</span>
            </div>
          `;
        }

        const p = member.p;
        const sprite = getSpriteUrl(p);
        const assignedMovesHtml = member.moves.map(mKey => {
          let mData = mKey ? movesMap[mKey.toUpperCase()] : null;
          return mData ? `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-100 dark:bg-slate-950 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 truncate">${mData.name}</span>` : `<span class="px-1.5 py-0.5 rounded text-[9px] text-slate-400 bg-slate-50 dark:bg-slate-950 border border-dashed border-slate-200 dark:border-slate-800">-</span>`;
        }).join('');

        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-xs relative flex flex-col justify-between min-h-[160px]">
            <button onclick="removeFromTeam(${idx}, event)" title="Remove" class="absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-rose-500 hover:text-white text-slate-400 transition flex items-center justify-center text-[10px]">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <div onclick="openTeamConfigModal(${idx})" class="cursor-pointer">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[10px] font-mono text-slate-400">#${p.id}</span>
                <span class="text-[8px] font-bold px-1.5 py-0.2 bg-slate-100 dark:bg-slate-950 rounded text-slate-500">Edit Moves</span>
              </div>
              <div class="w-12 h-12 mx-auto my-1 flex items-center justify-center">
                ${sprite ? `<img src="${sprite}" class="max-w-full max-h-full object-contain">` : `<i class="fa-solid fa-dragon text-slate-400"></i>`}
              </div>
              <h4 class="font-extrabold text-xs text-center truncate text-slate-900 dark:text-slate-100">${p.name}</h4>
              <div class="grid grid-cols-2 gap-1 mt-2">${assignedMovesHtml}</div>
            </div>
            <div class="flex justify-center gap-1 mt-3">
              ${renderTypeBadge(p.type1)}
              ${p.type2 ? renderTypeBadge(p.type2) : ''}
            </div>
          </div>
        `;
      }).join('');

      let teamWeaknessCounts = {};
      CHART_TYPES.forEach(t => teamWeaknessCounts[t] = 0);

      currentTeam.filter(Boolean).forEach(member => {
        let mults = calculateTypeMultipliers(member.p.type1, member.p.type2);
        CHART_TYPES.forEach(atkType => {
          if (mults[atkType] > 1.0) {
            teamWeaknessCounts[atkType] = (teamWeaknessCounts[atkType] || 0) + 1;
          }
        });
      });

      let teamAnalysisHtml = CHART_TYPES.map(atkType => {
        let count = teamWeaknessCounts[atkType];
        let bgClass = 'bg-slate-100 dark:bg-slate-950 text-slate-400';
        if (count >= 3) bgClass = 'bg-rose-500/20 text-rose-400 font-extrabold';
        else if (count > 0) bgClass = 'bg-amber-500/10 text-amber-500 font-bold';

        return `
          <div class="flex flex-col items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-1.5 text-center shadow-2xs">
            <div class="mb-1">${renderTypeBadge(atkType)}</div>
            <div class="w-full py-1 rounded-lg text-xs font-mono ${bgClass}">${count}x</div>
          </div>
        `;
      }).join('');

      let teamCoverageCounts = {};
      CHART_TYPES.forEach(t => teamCoverageCounts[t] = 0);

      currentTeam.filter(Boolean).forEach(member => {
        let memberOffensiveTypes = new Set();
        memberOffensiveTypes.add(member.p.type1);
        if (member.p.type2) memberOffensiveTypes.add(member.p.type2);

        member.moves.forEach(mKey => {
          if (mKey && movesMap[mKey.toUpperCase()]) {
            let mData = movesMap[mKey.toUpperCase()];
            if (mData.power > 0) memberOffensiveTypes.add(mData.type);
          }
        });

        memberOffensiveTypes.forEach(atkType => {
          CHART_TYPES.forEach(defType => {
            let defData = TYPE_CHART[defType];
            if (defData && defData.weaknesses && defData.weaknesses.includes(atkType)) {
              teamCoverageCounts[defType] = (teamCoverageCounts[defType] || 0) + 1;
            }
          });
        });
      });

      let teamCoverageHtml = CHART_TYPES.map(defType => {
        let count = teamCoverageCounts[defType];
        let bgClass = 'bg-slate-100 dark:bg-slate-950 text-slate-400';
        if (count > 0) bgClass = 'bg-emerald-500/20 text-emerald-400 font-extrabold';

        return `
          <div class="flex flex-col items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-1.5 text-center shadow-2xs">
            <div class="mb-1">${renderTypeBadge(defType)}</div>
            <div class="w-full py-1 rounded-lg text-xs font-mono ${bgClass}">${count > 0 ? count + ' hits' : '—'}</div>
          </div>
        `;
      }).join('');

      feed.innerHTML = `
        <div class="col-span-full space-y-5">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-extrabold text-base text-slate-900 dark:text-slate-100">Team Roster</h3>
              <p class="text-xs text-slate-500">Assemble up to 6 Pokémon, assign moves, and analyze coverage.</p>
            </div>
            <button onclick="clearTeam()" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-rose-500 hover:text-white text-slate-600 dark:text-slate-300 rounded-xl transition">
              Clear Team
            </button>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
            ${slotsHtml}
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-xs space-y-3">
            <h4 class="font-bold text-[10px] uppercase tracking-wider text-slate-400 text-center">Team Defensive Weaknesses</h4>
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 gap-2">
              ${teamAnalysisHtml}
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-xs space-y-3">
            <h4 class="font-bold text-[10px] uppercase tracking-wider text-slate-400 text-center">Offensive Type Coverage</h4>
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 gap-2">
              ${teamCoverageHtml}
            </div>
          </div>
        </div>
      `;
    }

    function clearTeam() {
      currentTeam = [null, null, null, null, null, null];
      renderTeamBuilderPage();
    }
    // --- END TEAM BUILDER LOGIC ---

    function calculateTypeMultipliers(defT1, defT2) {
      let results = {};
      CHART_TYPES.forEach(atkType => {
        let mult = 1.0;
        function applyDef(t) {
          let tData = TYPE_CHART[t];
          if (!tData) return;
          if (tData.weaknesses && tData.weaknesses.includes(atkType)) mult *= 2.0;
          if (tData.resistances && tData.resistances.includes(atkType)) mult *= 0.5;
          if (tData.immunities && tData.immunities.includes(atkType)) mult *= 0.0;
        }
        applyDef(defT1);
        if (defT2) applyDef(defT2);
        results[atkType] = mult;
      });
      return results;
    }

    function navigateToPokemonPage(key) {
      const p = pokemonMap[key];
      if (!p) return;
      activePokemon = p;
      activeMoveSubTab = 'all';
      moveFilterType = 'ALL';
      moveFilterCategory = 'ALL';
      currentViewMode = 'detail';
      document.getElementById('filter-toolbar').classList.add('hidden');
      renderPokemonDetailPage();
    }

    function switchMoveSubTab(subTab) {
      activeMoveSubTab = subTab;
      renderPokemonDetailPage();
    }

    function applyMoveFilters() {
      moveFilterType = document.getElementById('move-filter-type').value;
      moveFilterCategory = document.getElementById('move-filter-cat').value;
      renderPokemonDetailPage();
    }

    function renderPokemonDetailPage() {
      if (!activePokemon) return;
      const p = activePokemon;

      const sprite = getSpriteUrl(p);
      const t1 = renderTypeBadge(p.type1);
      const t2 = p.type2 ? renderTypeBadge(p.type2) : '';

      const statsHtml = p.baseStats.map((val, idx) => {
        const pct = Math.min(100, Math.round((val / 200) * 100));
        return `
          <div class="flex items-center text-[11px] gap-2.5">
            <span class="w-10 font-bold text-slate-400 dark:text-slate-500">${STAT_NAMES[idx]}</span>
            <span class="w-6 font-mono font-bold text-right text-slate-800 dark:text-slate-200">${val}</span>
            <div class="flex-1 bg-slate-100 dark:bg-slate-950 h-1.5 rounded-full overflow-hidden border border-transparent dark:border-slate-800">
              <div class="bg-rose-500 h-full rounded-full" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      const multipliers = calculateTypeMultipliers(p.type1, p.type2);

      let chartRowHtml = CHART_TYPES.map(atkType => {
        let mult = multipliers[atkType];
        let label = '1';
        let bgClass = 'bg-slate-100 dark:bg-slate-950 text-slate-500';
        if (mult > 1.0) {
          label = mult === 4.0 ? '4' : '2';
          bgClass = 'bg-emerald-500/20 text-emerald-400 font-extrabold';
        } else if (mult === 0.0) {
          label = '—';
          bgClass = 'bg-slate-900 text-slate-600';
        } else if (mult < 1.0) {
          label = mult === 0.25 ? '¼' : '½';
          bgClass = 'bg-rose-500/20 text-rose-400 font-extrabold';
        }

        return `
          <div class="flex flex-col items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-1.5 text-center shadow-2xs">
            <div class="mb-1">${renderTypeBadge(atkType)}</div>
            <div class="w-full py-1 rounded-lg text-xs font-mono ${bgClass}">${label}</div>
          </div>
        `;
      }).join('');

      let movesListToRender = [];
      let allMap = new Map();
      p.movesLevel.forEach(m => allMap.set(m.moveKey.toUpperCase(), { label: `Lvl ${m.level}`, ...movesMap[m.moveKey.toUpperCase()] || { type: 'NORMAL', power: 0, category: 'Physical', description: 'No description.' } }));
      p.tutorMoves.forEach(k => allMap.set(k.toUpperCase(), { label: 'Tutor/TM', ...movesMap[k.toUpperCase()] || { type: 'NORMAL', power: 0, category: 'Physical', description: 'No description.' } }));
      p.eggMoves.forEach(k => allMap.set(k.toUpperCase(), { label: 'Egg', ...movesMap[k.toUpperCase()] || { type: 'NORMAL', power: 0, category: 'Physical', description: 'No description.' } }));

      if (activeMoveSubTab === 'all') {
        movesListToRender = Array.from(allMap.values());
      } else if (activeMoveSubTab === 'level') {
        movesListToRender = p.movesLevel.map(m => ({ label: `Lvl ${m.level}`, ...movesMap[m.moveKey.toUpperCase()] || { type: 'NORMAL', power: 0, category: 'Physical', description: 'No description.' } }));
      } else if (activeMoveSubTab === 'tutor') {
        movesListToRender = p.tutorMoves.map(k => ({ label: 'Tutor/TM', ...movesMap[k.toUpperCase()] || { type: 'NORMAL', power: 0, category: 'Physical', description: 'No description.' } }));
      } else if (activeMoveSubTab === 'egg') {
        movesListToRender = p.eggMoves.map(k => ({ label: 'Egg', ...movesMap[k.toUpperCase()] || { type: 'NORMAL', power: 0, category: 'Physical', description: 'No description.' } }));
      }

      movesListToRender = movesListToRender.filter(m => {
        if (!m) return false;
        if (moveFilterType !== 'ALL' && m.type !== moveFilterType) return false;
        if (moveFilterCategory !== 'ALL' && m.category.toLowerCase() !== moveFilterCategory.toLowerCase()) return false;
        return true;
      });

      const movesHtml = movesListToRender.map(m => {
        const badge = renderTypeBadge(m.type);
        const safeDesc = (m.description || '').replace(/'/g, "\\'").replace(/\n/g, ' ');
        const pow = m.power > 0 ? m.power : '-';
        const acc = m.accuracy > 0 ? m.accuracy + '%' : '-';

        return `
          <div onclick="openMoveModal('${m.name || 'Move'}', '${m.type || 'NORMAL'}', '${m.category || 'Physical'}', ${m.power || 0}, ${m.accuracy || 0}, ${m.pp || 10}, '${safeDesc}')" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 hover:border-rose-300 dark:hover:border-rose-500/50 cursor-pointer transition flex items-center justify-between text-xs shadow-2xs">
            <div class="flex flex-col gap-0.5 min-w-0 pr-2">
              <div class="flex items-center gap-2">
                <span class="font-mono text-[9px] text-rose-500 dark:text-rose-400 font-bold">${m.label}</span>
                <span class="font-bold text-slate-800 dark:text-slate-200 text-xs truncate">${m.name || 'Unknown'}</span>
              </div>
              <div class="flex items-center gap-2 text-[10px] font-mono text-slate-400">
                <span>Pow: <strong class="text-slate-700 dark:text-slate-300">${pow}</strong></span>
                <span>Acc: <strong class="text-slate-700 dark:text-slate-300">${acc}</strong></span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 flex-shrink-0">
              ${badge}
              <span class="w-16 py-0.5 rounded text-[8px] font-medium bg-slate-100 dark:bg-slate-950 text-slate-600 dark:text-slate-400 text-center truncate border border-transparent dark:border-slate-800">${m.category}</span>
            </div>
          </div>
        `;
      }).join('');

      const aClass = activeMoveSubTab === 'all' ? 'bg-rose-500 text-white font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800';
      const lClass = activeMoveSubTab === 'level' ? 'bg-rose-500 text-white font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800';
      const tClass = activeMoveSubTab === 'tutor' ? 'bg-rose-500 text-white font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800';
      const eClass = activeMoveSubTab === 'egg' ? 'bg-rose-500 text-white font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800';

      let abilitiesHtml = p.abilities.map(abName => {
        let abKey = abName.toUpperCase().replace(/[^A-Z0-9_]/g, '');
        let abData = abilitiesMap[abKey] || abilitiesMap[abName.toUpperCase()] || { name: abName, description: 'No description available.' };
        return `
          <div class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-1">
            <span class="font-extrabold text-xs text-slate-900 dark:text-slate-100 block">${abData.name}</span>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-snug">${abData.description}</p>
          </div>
        `;
      }).join('');

      if (p.hiddenAbility) {
        let hKey = p.hiddenAbility.toUpperCase().replace(/[^A-Z0-9_]/g, '');
        let hData = abilitiesMap[hKey] || abilitiesMap[p.hiddenAbility.toUpperCase()] || { name: p.hiddenAbility, description: 'No description available.' };
        abilitiesHtml += `
          <div class="p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 space-y-1">
            <span class="font-extrabold text-xs text-rose-500 dark:text-rose-400 block">Hidden: ${hData.name}</span>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-snug">${hData.description}</p>
          </div>
        `;
      }

      let typeOptionsHtml = `<option value="ALL">All Types</option>` + CHART_TYPES.map(t => `<option value="${t}" ${moveFilterType === t ? 'selected' : ''}>${t}</option>`).join('');

      document.getElementById('content-feed').innerHTML = `
        <div class="col-span-full space-y-3.5">
          <button onclick="goBackToGrid()" class="px-3 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5 shadow-2xs">
            <i class="fa-solid fa-arrow-left text-[10px]"></i> Back
          </button>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-xs flex items-center gap-4">
            <div class="w-16 h-16 rounded-xl bg-slate-100 dark:bg-slate-950 border border-transparent dark:border-slate-800 flex items-center justify-center p-1.5 flex-shrink-0">
              ${sprite ? `<img src="${sprite}" class="max-w-full max-h-full object-contain">` : `<i class="fa-solid fa-dragon text-slate-300 dark:text-slate-700 text-xl"></i>`}
            </div>
            <div class="min-w-0 flex-1">
              <span class="font-mono text-[10px] font-bold text-slate-400 dark:text-slate-500">#${p.id}</span>
              <h2 class="text-lg font-black text-slate-900 dark:text-slate-100 truncate">${p.name}</h2>
              <div class="flex gap-1 pt-0.5">
                ${t1}
                ${t2}
              </div>
            </div>
          </div>

          <div class="p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl italic text-[11px] text-slate-600 dark:text-slate-400 shadow-2xs">
            "${p.pokedex || 'No description available.'}"
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-xs space-y-2.5">
            <h4 class="font-bold text-[10px] uppercase tracking-wider text-slate-400 dark:text-slate-500 text-center">Weaknesses & Resistances</h4>
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 gap-2">
              ${chartRowHtml}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-xs">
              <h4 class="font-bold text-[10px] uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Base Stats (BST: ${p.bst})</h4>
              <div class="space-y-1.5">${statsHtml}</div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-xs space-y-3">
              <h4 class="font-bold text-[10px] uppercase tracking-wider text-slate-400 dark:text-slate-500">Abilities & Descriptions</h4>
              <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                ${abilitiesHtml}
              </div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-xs space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 border-b border-slate-100 dark:border-slate-800 pb-2.5">
              <h4 class="font-bold text-[10px] uppercase tracking-wider text-slate-400 dark:text-slate-500">Moveset</h4>
              <div class="flex flex-wrap gap-1 bg-slate-100 dark:bg-slate-950 p-0.5 rounded-lg text-[11px] font-bold border border-transparent dark:border-slate-800">
                <button onclick="switchMoveSubTab('all')" class="px-2.5 py-0.5 rounded-md transition ${aClass}">All</button>
                <button onclick="switchMoveSubTab('level')" class="px-2.5 py-0.5 rounded-md transition ${lClass}">Level Up</button>
                <button onclick="switchMoveSubTab('tutor')" class="px-2.5 py-0.5 rounded-md transition ${tClass}">Tutor/TM</button>
                <button onclick="switchMoveSubTab('egg')" class="px-2.5 py-0.5 rounded-md transition ${eClass}">Egg</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs">
              <select id="move-filter-type" onchange="applyMoveFilters()" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-1.5 font-bold text-slate-700 dark:text-slate-300 focus:outline-none cursor-pointer">
                ${typeOptionsHtml}
              </select>
              <select id="move-filter-cat" onchange="applyMoveFilters()" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-1.5 font-bold text-slate-700 dark:text-slate-300 focus:outline-none cursor-pointer">
                <option value="ALL" ${moveFilterCategory === 'ALL' ? 'selected' : ''}>All Categories</option>
                <option value="Physical" ${moveFilterCategory === 'Physical' ? 'selected' : ''}>Physical</option>
                <option value="Special" ${moveFilterCategory === 'Special' ? 'selected' : ''}>Special</option>
                <option value="Status" ${moveFilterCategory === 'Status' ? 'selected' : ''}>Status</option>
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 max-h-72 overflow-y-auto pr-1">
              ${movesHtml || '<p class="text-xs text-slate-400 dark:text-slate-500 col-span-full text-center py-4">No moves found matching filters.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderTypeChartPage() {
      const feed = document.getElementById('content-feed');
      
      let rowsHtml = CHART_TYPES.map(defType => {
        let cells = CHART_TYPES.map(atkType => {
          let tData = TYPE_CHART[defType];
          let status = '1';
          let bg = 'text-slate-400';
          if (tData) {
            if (tData.weaknesses && tData.weaknesses.includes(atkType)) { status = '2'; bg = 'bg-emerald-500/20 text-emerald-400 font-bold'; }
            else if (tData.resistances && tData.resistances.includes(atkType)) { status = '½'; bg = 'bg-rose-500/20 text-rose-400 font-bold'; }
            else if (tData.immunities && tData.immunities.includes(atkType)) { status = '0'; bg = 'bg-slate-800 text-slate-500 font-bold'; }
          }
          return `<td class="p-1 text-center border border-slate-200 dark:border-slate-800 text-[10px] ${bg}">${status}</td>`;
        }).join('');

        return `
          <tr>
            <td class="p-1.5 border border-slate-200 dark:border-slate-800 sticky-col bg-white dark:bg-slate-900">${renderTypeBadge(defType)}</td>
            ${cells}
          </tr>
        `;
      }).join('');

      let headers = CHART_TYPES.map(t => `<th class="p-1 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">${renderTypeBadge(t)}</th>`).join('');

      feed.innerHTML = `
        <div class="col-span-full space-y-4">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-xs">
            <h3 class="font-extrabold text-sm mb-1 text-slate-900 dark:text-slate-100">Type Chart (Defending Type vs Incoming Attack Type)</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mb-4">First column is sticky for smooth horizontal scrolling.</p>
            <div class="overflow-x-auto max-h-[70vh]">
              <table class="w-full border-collapse">
                <thead class="sticky top-0 z-20 bg-white dark:bg-slate-900">
                  <tr>
                    <th class="p-1 border border-slate-200 dark:border-slate-800 text-[10px] text-slate-400 sticky-col bg-white dark:bg-slate-900">Def \ Atk</th>
                    ${headers}
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function goBackToGrid() {
      currentViewMode = 'grid';
      activePokemon = null;
      document.getElementById('filter-toolbar').classList.remove('hidden');
      applyFilter();
    }

    function openMoveModal(name, type, category, power, accuracy, pp, description) {
      const tBadge = renderTypeBadge(type);
      document.getElementById('move-popup-content').innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2.5 pr-8">
          <h3 class="font-extrabold text-base text-slate-900 dark:text-slate-100 truncate">${name}</h3>
          ${tBadge}
        </div>
        <div class="grid grid-cols-3 gap-1.5 text-center text-xs font-mono">
          <div class="p-2 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800">
            <span class="text-[7px] text-slate-400 dark:text-slate-500 block font-bold">CAT</span>
            <span class="font-bold text-slate-700 dark:text-slate-300 text-[10px]">${category}</span>
          </div>
          <div class="p-2 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800">
            <span class="text-[7px] text-slate-400 dark:text-slate-500 block font-bold">POWER</span>
            <span class="font-bold text-rose-600 dark:text-rose-400 text-[10px]">${power > 0 ? power : '-'}</span>
          </div>
          <div class="p-2 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800">
            <span class="text-[7px] text-slate-400 dark:text-slate-500 block font-bold">ACC</span>
            <span class="font-bold text-slate-700 dark:text-slate-300 text-[10px]">${accuracy > 0 ? accuracy + '%' : '-'}</span>
          </div>
        </div>
        <div class="p-2.5 bg-slate-50 dark:bg-slate-950 rounded-xl text-xs space-y-0.5 border border-slate-200 dark:border-slate-800">
          <span class="text-[8px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Description</span>
          <p class="text-slate-700 dark:text-slate-300 leading-relaxed text-[11px]">${description}</p>
        </div>
      `;
      document.getElementById('move-modal').classList.remove('hidden');
    }
  </script>
</body>
</html>
